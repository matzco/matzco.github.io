<!DOCTYPE html>
<html>
<head>
    <title>Search by Name</title>
    <meta charset="UTF-8">
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Search by Name</a></li>
                <li><a href="all_by_letter.html">Mishnayot by Letter</a></li>
                <li><a href="all_by_masechta.html">Mishnayot by Masechta</a></li>
            </ul>
        </nav>
    </header>
    <div id="keyboardPage" class="keyboard">
        <textarea id="nameInput" class="input-field" placeholder="Enter name here..."></textarea>
        
        <div class="keyboard-row">
            <span class="key">ק</span>
            <span class="key">ר</span>
            <span class="key">א</span>
            <span class="key">ט</span>
            <span class="key">ו</span>
            <span class="key">ן</span>
            <span class="key">ם</span>
            <span class="key">פ</span>
        </div>
        <div class="keyboard-row">
            <span class="key">ש</span>
            <span class="key">ד</span>
            <span class="key">ג</span>
            <span class="key">כ</span>
            <span class="key">ע</span>
            <span class="key">י</span>
            <span class="key">ח</span>
            <span class="key">ל</span>
            <span class="key">ך</span>
            <span class="key">ף</span>
        </div>
        <div class="keyboard-row">
            <span class="key">ז</span>
            <span class="key">ס</span>
            <span class="key">ב</span>
            <span class="key">ה</span>
            <span class="key">נ</span>
            <span class="key">מ</span>
            <span class="key">צ</span>
            <span class="key">ת</span>
            <span class="key">ץ</span>
        </div>
        <div class="keyboard-row">
            <span class="key special-key">Space</span>
            <span class="key special-key">Enter</span>
            <span class="key special-key">Backspace</span>
            <span class="key special-key">Clear</span>
            <span class="key special-key">בת</span>
            <span class="key special-key">בן</span>
        </div>
    </div>

    <div id="resultPage">
        <h2>Mishnah References for: <span id="displayedName"></span></h2>
        <div id="resultsContainer"></div>
        <button onclick="goBack()" class="special-key">Back to Keyboard</button>
        <button onclick="genSelecteds()" class="special-key">Generate Sefaria Source Sheet</button>
    </div>

    <script>
      function fetch_data() {
        fetch("./mish_db.json")
          .then((res) => {
              if (!res.ok) {
                  throw new Error(`HTTP error! Status: ${res.status}`);
              }
              return res.json();
          })
          .then((data) => {
              window.mishData = data;
              console.log('mish_db loaded successfully.');
              setupKeyboardHandlers(); 
          })
          .catch((error) => console.error("Unable to fetch data:", error));
      }

      function setupKeyboardHandlers() {
        console.log('Called setupKeyboardHandlers');
        const input = document.getElementById('nameInput'); 
        const keys = document.querySelectorAll('.key');
        
        keys.forEach(key => {
            key.addEventListener('click', function() {
              const keyValue = this.textContent;
              const cursorPos = input.selectionStart; 
              switch(keyValue) {
                
                  case 'Space':
                      input.value = input.value.slice(0, cursorPos) + ' ' + input.value.slice(cursorPos);
                      input.selectionStart = cursorPos + 1;
                      input.selectionEnd = cursorPos + 1;
                      break;
                  case 'Enter':
                    const name  = input.value;
                    window.name = name;
                    input.value = '';
                    processName(name);
                    break;
                  case 'Backspace':
                      if (cursorPos > 0) {
                          input.value = input.value.slice(0, cursorPos - 1) + input.value.slice(cursorPos);
                          input.selectionStart = cursorPos - 1;
                          input.selectionEnd = cursorPos - 1;
                      }
                      break;
                  case 'Clear':
                      input.value = ''
                      break;
                  default:
                      input.value = input.value.slice(0, cursorPos) + keyValue + input.value.slice(cursorPos);
                      input.selectionStart = cursorPos + 1;
                      input.selectionEnd = cursorPos + 1;
              }
              input.focus();
          });
        });
        input.addEventListener('keydown', function(e) {
          const allowedKeys = ['Backspace', ' ', 'ArrowLeft', 'ArrowRight'];
          if (allowedKeys.includes(e.key)) {
            return;
          }
            e.preventDefault();
        });
      }

      function convertSofit (name) {
        return name.replace("ם", "מ").replace("ן", "נ").replace("ך", "כ").replace("ץ", "צ").replace("ף", "פ")
      }

      function processName(name) {
        if (!window.mishData) {
          console.log('Data was not loaded correctly.');
          return;
        }
        name = convertSofit(name)
        let results = new Map()
        for (letter of name) {
          if (results.has(letter)) {
            continue;
          }
          const letterData = window.mishData[letter]
          if (letterData) {
            results.set(letter, letterData);
            console.log('Found data for letter', letter);
          } else {
            console.log('letterData is empty for ' + letter)
          }
        }
        showResults(name, results);
      }

      function showResults(name, results) {
        // Hide keyboard instead of open a new page
        document.getElementById('displayedName').textContent = name;
        document.getElementById('keyboardPage').style.display = 'none';
        document.getElementById('resultPage').style.display = 'block';
        //Build page
        const container = document.getElementById('resultsContainer');

        container.innerHTML = '';
        if (!results) {
          container.textContent = "No results found.";
          return;
        }

        for (let i = 0; i < name.length; i++) {
          const letter = name[i]
          console.log('Building div for letter', letter)

          if (letter == ' ') {
            continue;
          }
          const mishnayot = results.get(letter);
          const resultDiv = document.createElement('div');
          resultDiv.className = 'letter-result';

          const letterLabel = document.createElement('h3')
          letterLabel.className = 'letter-label'
          letterLabel.textContent = `${letter}`;
          
          resultDiv.appendChild(letterLabel);

          for (const [tractate, entries] of Object.entries(mishnayot)) {
            entries.forEach((entry) => {
              const mishnaRef = document.createElement('div');
              mishnaRef.className = 'mishnaRef';

              const button = document.createElement('input');
              button.type = 'radio';
              button.id = `${letter}-${tractate}-${entry}`;
              button.name = `${letter}-${i}`; 

              const buttonLabel = document.createElement('label')
              buttonLabel.textContent = `${tractate} ${entry}`

              mishnaRef.appendChild(button);
              mishnaRef.appendChild(buttonLabel)
              resultDiv.appendChild(mishnaRef);
            })
          
          }
          container.appendChild(resultDiv); 
        }
      }

      function goBack() {
        document.getElementById('resultPage').style.display = 'none';
        document.getElementById('keyboardPage').style.display = 'block';
      }

      function genSelecteds() {
        const selectedButtonsList = document.querySelectorAll(`input:checked`)
        if (selectedButtonsList.length != window.name.length) {
          alert('Please select a Mishna for each letter.')
          console.log('selected',selectedButtonsList.length, 'name.length is',window.name.length)
        } else {
          const selectedButtons = Array.from(selectedButtonsList);
          console.log('selected', selectedButtons.length, 'items',  selectedButtons)
          genSefaria(selectedButtons)
        }
      }

      function genSefaria(selecteds) {
        for (mish of selecteds) {
          sefariaLink(mish)
        }
      }

      function sefariaLink(mishna) {
        let code = mishna.id.split("-") 
        // ד-Kilayim-3:7
        
        if (code[1]) {
          //some masechtot need extra processing
        }
        const perekMishna = code[2].split(":")
        const sefariaString = 'Mishnah ' + code[1] + ' ' + perekMishna[0];
        console.log('perek', perekMishna)
        const link = "https://www.sefaria.org/api/texts/" + sefariaString;
        console.log(link)
        getMishna(link, perekMishna[1])
      }

      async function getMishna(link, number) {
        try {
          const response = await fetch(link);
          if (!response.ok) {
            throw new Error(`HTTP error! Status ${response.status}`)
          }

          const data = await response.json();

          //Validate response page

          const mishna = data.he[number-1];
          console.log(mishna)

      } catch (error) {
        console.error('Error', error);
        return null;
      }
    }
      document.addEventListener('DOMContentLoaded', function() {
        fetch_data();
      });

    </script>
  </body>
</html>
