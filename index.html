        // Helper function to get multiple random items from an array
        function getRandomUniqueItems(array, count) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        // Helper function to get all possible references for a letter
        function getAllReferences(letterData) {
            const allRefs = [];
            for (const [tractate, refs] of Object.entries(letterData)) {
                refs.forEach(ref => {
                    allRefs.push({ tractate, reference: ref });
                });
            }
            return allRefs;
        }

        // Helper function to get multiple unique references for a letter
        function getMultipleReferences(letterData, count) {
            const allRefs = getAllReferences(letterData);
            return getRandomUniqueItems(allRefs, count);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('nameInput');
            const keys = document.querySelectorAll('.key');

            keys.forEach(key => {
                key.addEventListener('click', function() {
                    const keyValue = this.textContent;
                    const cursorPos = input.selectionStart;
                    
                    switch(keyValue) {
                        case 'Space':
                            input.value = input.value.slice(0, cursorPos) + ' ' + input.value.slice(cursorPos);
                            input.selectionStart = cursorPos + 1;
                            input.selectionEnd = cursorPos + 1;
                            break;
                        case 'Enter':
                            processName(input.value);
                            break;
                        case 'Backspace':
                            if (cursorPos > 0) {
                                input.value = input.value.slice(0, cursorPos - 1) + input.value.slice(cursorPos);
                                input.selectionStart = cursorPos - 1;
                                input.selectionEnd = cursorPos - 1;
                            }
                            break;
                        default:
                            input.value = input.value.slice(0, cursorPos) + keyValue + input.value.slice(cursorPos);
                            input.selectionStart = cursorPos + 1;
                            input.selectionEnd = cursorPos + 1;
                    }
                    input.focus();
                });
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace') {
                    return;
                }
                e.preventDefault();
            });
        });

        function processName(name) {

            // Change sofit letters
            name = name.replace("ם", "מ").replace("ן", "נ").replace("ך", "כ").replace("ץ", "צ").replace("ף", "פ")
            
            const letterCounts = {};
            name.split('').forEach(letter => {
                if (letter !== ' ' && letter !== '\n') {
                    letterCounts[letter] = (letterCounts[letter] || 0) + 1;
                }
            });
            
            // Get references for each letter based on its count
            const results = [];
            for (const [letter, count] of Object.entries(letterCounts)) {
                if (mishnahDB[letter]) {
                    const refs = getMultipleReferences(mishnahDB[letter], count);
                    if (refs.length > 0) {
                        results.push({
                            letter,
                            count,
                            references: refs
                        });
                    }
                }
            }

            showResults(name, results);
        }

        function showResults(name, results) {
            document.getElementById('keyboardPage').style.display = 'none';
            document.getElementById('resultPage').style.display = 'block';
            
            document.getElementById('displayedName').textContent = name;
            
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            
            results.forEach(result => {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'letter-result';
                
                const letterLabel = document.createElement('div');
                letterLabel.className = 'letter-label';
                letterLabel.textContent = `${result.letter}`;
                
                const refsContainer = document.createElement('div');
                refsContainer.className = 'multiple-refs';
                
                result.references.forEach((ref, idx) => {
                    const reference = document.createElement('div');
                    reference.className = 'reference';
                    reference.innerHTML = `${idx + 1}. <span class="tractate">${ref.tractate}</span> ${ref.reference}`;
                    refsContainer.appendChild(reference);
                });
                
                resultDiv.appendChild(letterLabel);
                resultDiv.appendChild(refsContainer);
                container.appendChild(resultDiv);
            });
        }

        function goBack() {
            document.getElementById('resultPage').style.display = 'none';
            document.getElementById('keyboardPage').style.display = 'block';
        }
