<!DOCTYPE html>
<html>
<head>
    <title>Mishnayot Texts</title>
    <meta charset="UTF-8">
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Search by Name</a></li>
            </ul>
        </nav>
    </header>
    <div id="mishnaText"></div>
    <script>
      
      window.onload = function() {
        const loaded = localStorage.getItem('mishnayot');
        const mishnayot = JSON.parse(loaded)
        console.log('parsed from localStorage', mishnayot.toString())
        if (!mishnayot) {
            alert('Error: No data, please try again');
            window.open('index.html');
        }
       
        for (mishna of mishnayot) {
            let code = mishna.split("-") 
            console.log(mishna, 'split into', code)
            if (code[1]) {
                //some masechtot need extra processing
            }
            const perekMishna = (code[2]).split(":")
            const sefariaString = 'Mishnah ' + code[1] + ' ' + perekMishna[0];
            console.log('perek', perekMishna)
            const link = "https://www.sefaria.org/api/texts/" + sefariaString;
            getMishna(link, perekMishna[1], code[0])
        }
      }

      async function getMishna(link, number, letter) {
        try {
          const response = await fetch(link);
          if (!response.ok) {
            throw new Error(`HTTP error! Status ${response.status}`)
          }

          const data = await response.json();

          //Validate response//

          const mishna = data.he[number-1];
          console.log(mishna)
          const mishnaText = document.getElementById('mishnaText');
          mishnaText.innerHTML += '<br><br>';
          mishnaText.innerHTML += letter;
          mishnaText.innerHTML += '<br>';
          mishnaText.innerHTML += mishna;
      } catch (error) {
        console.error('Error', error);
        return null;
      }
    }


    </script>
  </body>
</html>
