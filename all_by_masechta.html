<!DOCTYPE html>
<html>
<head>
    <title>Mishnayot by Masechta</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="test_mish.html">Search by Name</a></li>
                <li><a href="all_by_letter.html">Mishnayot by Letter</a></li>
                <li><a href="all_by_masechta.html">Mishnayot by Masechta</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <script>
            const tractateGroups = {};

            for (const groupName in tractateGroups) {
                

                const list = document.createElement('ul');
                list.classList.add('tractate-list');

                tractateGroups[groupName].forEach(tractate => {
                    const item = document.createElement('li');
                    item.classList.add('tractate-item');
                    item.textContent = tractate;
                    item.addEventListener('click', () => {
                        const allItems = document.querySelectorAll('.tractate-item');
                        allItems.forEach(el => el.classList.remove('selected'));
                        item.classList.add('selected');
                        showResultsForTractate(tractate); // Call showResultsForTractate
                    });
                    list.appendChild(item);
                });
                group.appendChild(list);
                document.querySelector('.container').appendChild(group);
            }


            function showResults(letter) {}

            function showResultsForTractate(tractateName) {
                const results = [];

                if (window.mishData) { // No need to check hasOwnProperty if iterating
                    for (const letter in window.mishData) {
                        const letterData = window.mishData[letter];
                        if (letterData.hasOwnProperty(tractateName)) {
                            results.push(...letterData[tractateName].map(mishna => ({ tractate: tractateName, mishna: mishna })));
                        }
                    }
                }

                displayResults(results);
            }


            function displayResults(results) {}

            fetch_data(); // Call fetch_data to load the JSON
        </script>
        <div id="results"></div> </div> </body> </html>
