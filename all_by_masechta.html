<!DOCTYPE html>
<html>
<head>
    <title>Mishnayot by Masechta</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>
<body>

    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Search by Name</a></li>
                <li><a href="all_by_letter.html">Mishnayot by Letter</a></li>
                <li><a href="all_by_masechta.html">Mishnayot by Masechta</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
    <script>
        const tractateGroups = {
        'Zeraim': ['Berakhot', 'Peah', 'Demai', 'Kilayim', 'Sheviit', 'Terumot', 'Maasrot', 'Maaser Sheni', 'Challah', 'Orlah', 'Bikkurim'],
        'Moed': ['Shabbat', 'Eruvin', 'Pesachim', 'Shekalim', 'Yoma', 'Sukkah', 'Beitzah', 'Rosh Hashanah', 'Taanit', 'Megillah', 'Moed Katan', 'Chagigah'],
        'Nashim': ['Yevamot', 'Ketubot', 'Nedarim', 'Nazir', 'Sotah', 'Gittin', 'Kiddushin'],
        'Nezikin': ['Bava Kamma', 'Bava Metzia', 'Bava Batra', 'Sanhedrin', 'Makkot', 'Shevuot', 'Eduyot', 'Avodah Zarah', 'Pirkei Avot', 'Horayot'],
        'Kodshim': ['Zevachim', 'Menachot', 'Chullin', 'Bekhorot', 'Arakhin', 'Temurah', 'Keritot', 'Meilah', 'Tamid', 'Middot', 'Kinnim'],
        'Taharot': ['Kelim', 'Oholot', 'Negaim', 'Parah', 'Tahorot', 'Mikvaot', 'Niddah', 'Makhshirin', 'Zavim', 'Tevul Yom', 'Yadayim', 'Oktzin']
        };

        for (const groupName in tractateGroups) {
        const group = document.createElement('div');
        group.classList.add('group');

        const title = document.createElement('div');
        title.classList.add('group-title');
        title.textContent = groupName;
        group.appendChild(title);

        const list = document.createElement('ul');
        list.classList.add('tractate-list');

        tractateGroups[groupName].forEach(tractate => {
            const item = document.createElement('li');
            item.classList.add('tractate-item');
            item.textContent = tractate;
            item.addEventListener('click', () => {
            // Remove 'selected' class from all items
            const allItems = document.querySelectorAll('.tractate-item');
            allItems.forEach(el => el.classList.remove('selected'));

            // Add 'selected' class to the clicked item
            item.classList.add('selected');

            // Call JSON search function (replace with your actual function)
            jsonSearch(tractate);
            });
            list.appendChild(item);
        });
        group.appendChild(list);
        document.querySelector('.container').appendChild(group);
        }
        function fetch_data() {
            fetch("./mish_db.json")
                .then((res) => {
                    if (!res.ok) {
                        throw new Error(`HTTP error! Status: ${res.status}`);
                    }
                    return res.json();
                })
                .then((data) => {
                    window.mishData = data;
                    console.log('mish_db loaded');
                    setupKeyboardHandlers();
                })
                .catch((error) => console.error("Unable to fetch data:", error));
        }

        function setupKeyboardHandlers() {
            document.querySelectorAll('.key').forEach(key => {
                key.addEventListener('click', () => {
                    document.querySelectorAll('.key').forEach(k => {
                        k.classList.remove('selected');
                    });
                    key.classList.add('selected');
                    showResults(key.textContent);
                });
            });
        }

        function showResults(letter) {
            const results = [];

            if (window.mishData && window.mishData.hasOwnProperty(letter)) {
                const letterData = window.mishData[letter];

                for (const tractateName in letterData) {
                    if (letterData.hasOwnProperty(tractateName)) {
                        results.push( ...letterData[tractateName].map(mishna => ({tractate: tractateName, mishna: mishna})));
                    }
                }
            }


            displayResults(results);
        }


        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (results.length === 0) {
                resultsDiv.textContent = "No results found.";
                return;
            }

            const ul = document.createElement('ul');
            results.forEach(result => {
                const li = document.createElement('li');
                li.textContent = `${result.tractate} - ${result.mishna}`; 
                ul.appendChild(li);
            });
            resultsDiv.appendChild(ul);
        }

    </script>
    </div>

</body>
</html>
